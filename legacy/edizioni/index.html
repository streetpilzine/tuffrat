<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edizioni — TuffRat</title>
  <link rel="stylesheet" href="/legacy/style.css">
</head>
<body>
  <header style="max-width:1200px; margin:0 auto; padding:2rem 1.25rem 0;">
    <a href="../" style="font-size:0.85rem; color:#555; text-decoration:none;">← TuffRat</a>
  </header>

  <main>
    <div class="section-header" style="margin-top:1.5rem;">
      <h2>Edizioni</h2>
      <p style="max-width:60ch;">Fanzine, stampe limitate, multipli e collaborazioni. Clicca su una fanzine per sfogliarla.</p>
    </div>

    <section class="gallery" aria-label="Edizioni e fanzine">
      <div class="grid">
        <!--
        Template card fanzina (sfogliabile). Dopo aver generato le pagine con:
          python tools/fanzine_to_pages.py <file.pdf> --slug streetpil-1
        duplica questa card per ogni fanzina, aggiornando data-title, data-folder, data-count e il src della copertina.

        <figure class="card flipbook-trigger"
          data-title="StreetPIL n.1"
          data-folder="/assets/img/edizioni/streetpil-1/pages"
          data-count="12">
          <img src="/assets/img/edizioni/streetpil-1/pages/01.webp" alt="StreetPIL n.1">
          <figcaption>StreetPIL n.1 · 2024 · Fanzine</figcaption>
        </figure>
        -->
      </div>
      <p class="edizioni__note">Fanzine in digitalizzazione — in arrivo.</p>
    </section>

    <section class="contact" style="margin-top:3.5rem;">
      <div class="contact__box">
        <h2>Acquisti &amp; richieste</h2>
        <p>Per ordini, distribuzione o collaborazioni editoriali:</p>
        <div class="contact__links">
          <a class="button" href="mailto:streetpilzine@gmail.com">E-mail</a>
          <a class="link" href="https://www.instagram.com/tuff_rat/" target="_blank" rel="noreferrer">Instagram</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Flipbook -->
  <div class="flipbook-overlay" id="flipbook-overlay">
    <div class="flipbook__backdrop" id="flipbook-backdrop"></div>
    <div class="flipbook__content">
      <button class="flipbook__close" id="flipbook-close" aria-label="Chiudi">×</button>
      <div class="flipbook__title" id="flipbook-title"></div>
      <div class="flipbook__book" id="flipbook"></div>
      <div class="flipbook__bar">
        <button id="flipbook-prev" aria-label="Precedente">←</button>
        <span class="flipbook__count" id="flipbook-count"></span>
        <button id="flipbook-next" aria-label="Successivo">→</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 TuffRat — Portfolio</p>
  </footer>

  <script src="/legacy/page-flip.browser.js"></script>
  <script src="/legacy/flipbook.js"></script>
</body>
</html>
